<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre Order GegaresanYuuk</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe6;--card:#fffdf9;--ink:#3e2c22;--muted:#8c7a6b;--line:#e6d8c6;
  --brand:#7a5236;--brand-2:#a98466;--brand-soft:#efe4d6;--accent:#5a3a28;
  --ok:#5f7a4a;--ok-soft:#e6ecdc;--warn:#9a6b2f;--warn-soft:#f2e7d3;
  --shadow:0 4px 18px rgba(80,55,35,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;color:var(--accent)}
header h1{color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}
header{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;padding:22px 0}
header h1{line-height:1.2;margin:0}
header .wrap{padding-bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:24px}
header small{opacity:.85;display:block}
main.wrap{margin-top:18px}
header small{margin-top:4px;font-size:13.5px}
.ctabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:16px;box-shadow:0 6px 18px rgba(90,55,30,.12)}
.ctabs button{border:0;background:transparent;border-radius:999px;padding:11px 8px;font:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.ctabs button.on{background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(90,55,30,.25)}
.card{background:var(--card);border:1px solid #ece2d4;border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1.5px solid var(--line);background:#fff;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink)}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn{border:0;background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:#fff;color:#8e3b2e;border:1px solid #e3c4b8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.open{background:var(--ok-soft);color:var(--ok)}
.pill.closed{background:#eee;color:#666}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.po-card{border:1px solid var(--line);border-left:4px solid #c2a073;border-radius:16px;padding:14px;cursor:pointer;background:#fff;transition:.15s;box-shadow:var(--shadow)}
.po-card:hover{border-color:var(--brand)}
.po-card.sel{border-color:var(--brand);background:var(--brand-soft)}
.po-card.dis{opacity:.5;cursor:not-allowed}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.stepper button{width:36px;height:36px;border:0;background:#fff;cursor:pointer;font-size:18px;font-weight:700;color:var(--brand)}
.stepper button:disabled{color:#ccc;cursor:not-allowed}
.stepper span{min-width:34px;text-align:center;font-weight:700}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps div{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps div.on{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;padding:12px;border-radius:12px;cursor:pointer;font-weight:600;text-align:left}
.seg button.on{border-color:var(--brand);background:var(--brand-soft)}
.seg small{display:block;font-weight:400;color:var(--muted)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.sticky .wrap{padding-bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{background:#fff;border:1px solid #ece2d4;border-radius:18px;padding:16px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column-reverse;gap:2px}
.stat b{display:block;font-size:26px;font-family:"Playfair Display",serif;font-weight:800;color:var(--brand)}
.stat:nth-child(2) b{color:var(--ok)}
.stat:nth-child(3) b{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f1e8dc;color:var(--accent);font-weight:700;white-space:nowrap}
td.num,th.num{text-align:right}
tfoot td{font-weight:700;background:#f1e8dc}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.modal{position:fixed;inset:0;background:rgba(40,20,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal .card{width:100%;max-width:820px}
.tbl-input input,.tbl-input select{padding:6px 8px;border-radius:8px;min-width:90px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:50;font-weight:600;font-size:14px}
.code{font-family:ui-monospace,monospace;background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:8px;font-weight:700;font-size:18px}
.empty{text-align:center;padding:30px;color:var(--muted)}
@media (max-width:560px){.seg{flex-direction:column}header h1{font-size:20px}}
/* ===== owner tahap 1 ===== */
:root{--red:#8e3b2e;--red-soft:#f6e3de}
.otabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}

.nf{background:#fff;border:1.5px solid var(--brand-2);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(90,55,30,.08)}

.onav button span{display:block;font-size:19px;margin-bottom:2px}
.onav button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(90,55,30,.22)}
.seg2{display:flex;background:var(--brand-soft);border-radius:999px;padding:3px;margin-top:12px}

.ord{background:#fff;border:1px solid var(--line);border-left:5px solid #d9a99d;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(90,55,30,.06)}

.ord-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.ord-h b{font-size:16px}
.ocode{font-family:ui-monospace,monospace;font-size:12px;color:var(--brand);background:var(--brand-soft);padding:1px 7px;border-radius:6px;white-space:nowrap}
.ship{font-size:13px;color:var(--muted);margin:6px 0 8px;display:flex;gap:6px}
.items{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:2px 0}

.note{background:var(--warn-soft);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:8px}
.ord-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.prog{flex:1}.prog .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:3px}.prog .bar i{display:block;height:100%;background:var(--ok)}
.ord-a{display:flex;gap:6px;margin-top:10px}.ord-a .btn{flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap;padding-left:6px;padding-right:6px;min-height:36px}.ord-a .del{flex:0 0 auto;color:var(--red)}
.vrow{padding:10px 0;border-bottom:1px dashed var(--line)}.vrow .big{font-family:"Playfair Display",serif;font-size:22px;color:var(--brand);font-weight:700;line-height:1}
.vtot{padding-top:12px}
.grp{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px}.grp h3{font-size:17px}
.sp{padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:10px}
.bawa{background:var(--brand-soft);border-color:#e0cdb6}
.bw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.bw span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.divh{font-weight:700;color:var(--brand);margin:14px 4px 6px;font-size:14px}
.chips.sub button{padding:5px 11px;font-size:12.5px}.chips.sub button.on{background:var(--brand);border-color:var(--brand)}
.hint{background:var(--brand-soft);border-radius:12px;padding:8px 12px;font-size:13px;margin-top:10px}
.pill.qr{background:#e6ecf3;color:#3d5a7a}.pill.lt{background:var(--warn-soft);color:#8a6a3a}
.paycard{text-align:center}.paycard .amt{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;color:var(--brand)}
.paycard img{width:100%;max-width:280px;border-radius:14px;border:1px solid var(--line);margin-top:8px;background:#fff}
.pgrp{padding-top:12px}.pgh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer;user-select:none}
.pgr{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.pgr small{color:var(--muted);font-size:12px}

.prodgrp .unit{font-size:12px;color:var(--muted);white-space:nowrap}.prodgrp .unit input{width:52px;padding:4px 6px;text-align:center;border-radius:8px;display:inline-block}

.stp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}

.prodgrp .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--brand-soft)}

.vr .nm{flex:1}.vr .q{font-weight:800;font-size:20px;min-width:44px;text-align:right}

.pay{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0 4px;border-top:1px solid var(--line);flex-wrap:wrap}

.pay:first-child{border-top:0}

.pay .acts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}.pay .acts .full{flex-basis:100%}
.pay .acts .btn{flex:1;text-align:center;white-space:nowrap;padding:10px 8px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;height:44px;box-sizing:border-box;line-height:1.2;margin:0}.pay .acts .btn.full{flex:1 1 100%}
a.btn{text-decoration:none}
.pill.red{background:var(--red-soft);color:var(--red)}
.exp{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-top:10px}
.exp .ic{font-size:26px;line-height:1}.exp .tx{flex:1}.exp b{display:block}
@media print{header,.noprint,.sticky,#loading{display:none!important}main{margin:0}.card{box-shadow:none;border:0}body{background:#fff}}

.po-card{padding:12px}
.po-thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--brand-soft)}
.photo-edit{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-edit .po-img{width:160px;margin:0}
.btn.wa{background:#25D366;color:#fff;display:inline-block;text-decoration:none;padding:13px 22px;font-size:15px;margin:6px 0 10px}
.qris{text-align:center}.qris .amt{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:var(--brand)}
.qris img{width:100%;max-width:280px;border-radius:14px;border:1px solid var(--line);margin-top:6px;background:#fff}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div><h1>🍰 Pre Order GegaresanYuuk</h1><small>Homemade cakes · pesan duluan, dibuat fresh</small></div>
    <div id="hdr-right"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<div id="loading"><div class="spin"></div></div>

<script>
/* =========================================================
   ALAMAT SERVER (Google Apps Script, URL deployment /exec)
   Kalau nanti deployment Apps Script ganti link, cukup ubah baris ini.
   ========================================================= */
window.API_URL = 'https://script.google.com/macros/s/AKfycbx6rnbnfc3zrjJy_0eJ8101wQA4egojvaB3QV5VqueBWPk6SzTGktM8NDnKAAqPxnTaPA/exec';
</script>
<script>
// link owner: alamat halaman + ?page=owner
const MODE = new URLSearchParams(location.search).get('page') === 'owner' ? 'owner' : 'cust';
// link bayar dari admin: ?bayar=GY-XXXX&n=170000
const PAYQ=(()=>{const q=new URLSearchParams(location.search),id=String(q.get('bayar')||'').replace(/[^A-Za-z0-9-]/g,'').slice(0,20),n=Math.round(Number(q.get('n')));
  return id&&n>0&&n<1e9?{id:id,n:n}:null;})();
const PT_LIST = ['Lippo','VIVERE'];

/* ================= UTIL ================= */
const rp = n => 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
const fd = s => s ? new Date(s+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : '-';
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normWA = s => String(s||'').replace(/\D/g,'').replace(/^62/,'0');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
let busy=0;
function loading(on){busy+=on?1:-1;document.getElementById('loading').classList.toggle('on',busy>0);}

/* ================= SERVER ================= */
// panggil fungsi di Code.gs; kalau gagal tampilkan pesan & kembalikan null
let lastErr='';
// Jalur 1: fetch POST ke URL /exec (tidak tergantung akun Google / cookie di HP)
async function viaFetch(fn,args){
  const url=window.API_URL;
  if(typeof url!=='string'||!/\/exec$/.test(url))return null;
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(url,{method:'POST',body:JSON.stringify({fn:fn,args:args}),signal:ctl.signal,redirect:'follow'});
    const j=await r.json();
    return (j&&typeof j.ok==='boolean')?j:null;
  }catch(e){return null;}finally{clearTimeout(tm);}
}
// Jalur 2: google.script.run (cara lama), dengan batas waktu
function viaGsr(fn,args){
  return new Promise(res=>{
    if(typeof google==='undefined'||!google.script||!google.script.run)return res(null);
    let done=false;const fin=j=>{if(!done){done=true;clearTimeout(tm);res(j);}};
    const tm=setTimeout(()=>fin(null),25000);
    google.script.run
      .withSuccessHandler(r=>fin({ok:true,result:r}))
      .withFailureHandler(e=>fin({ok:false,error:(e&&e.message)||String(e)}))
      [fn](...args);
  });
}
async function call(fn,...args){
  loading(true);
  const j=await viaFetch(fn,args);
  loading(false);
  if(!j){lastErr='Koneksi ke server gagal. Cek internet lalu coba lagi.';toast(lastErr);return null;}
  if(!j.ok){lastErr=j.error;toast(j.error);return null;}
  return j.result;
}

/* ================= DATA ================= */
let DB = {today:'',products:[],areas:[],pos:[],sold:{},orders:null};
function setDB(d){DB=Object.assign({orders:null},d);}

const API = {
  product: id => DB.products.find(p=>p.id===id),
  po: id => DB.pos.find(p=>p.id===id),
  area: id => DB.areas.find(a=>a.id===id),
  itemLabel: it => `${API.product(it.productId)?.name || '?'} – ${it.variant}`,
  isOpen: po => po.status==='open' && DB.today <= po.closeDate,
  ordersOf: poId => (DB.orders||[]).filter(o=>o.poId===poId),
  // owner: hitung dari semua pesanan. customer: dari rekap server (tanpa data pribadi)
  sold: (poId,itemId,excludeId) => {
    if(DB.orders) return DB.orders.filter(o=>o.poId===poId && o.id!==excludeId).reduce((s,o)=>s+(o.items[itemId]||0),0);
    let s = DB.sold[itemId]||0;
    if(excludeId && S.cust.origQty) s -= (S.cust.origQty[itemId]||0);
    return Math.max(0,s);
  },
  left: (po,it,excludeId) => it.slot - API.sold(po.id,it.id,excludeId),
  orderTotal: o => Number(o.subtotal)||0,
  orderGrand: o => Number(o.total)||0,
  orderPcs: o => Object.values(o.items).reduce((a,b)=>a+b,0),
  areaName: o => API.area(o.areaId)?.name || o.areaName || '-',
  shipLabel: o => o.metode==='kantor' ? `${o.pt} · ${o.divisi}` : o.metode==='antar' ? `Kirim/Antar · ${API.areaName(o)}` : 'Kirim/Antar · GoSend',
};
const METODE = {kantor:'Antar ke Kantor',antar:'Kirim/Antar',gosend:'Kirim/Antar (GoSend)'};

/* ================= STATE ================= */
const S = {
  loaded:false,
  cust:{tab:'pesan',step:1,poId:null,qty:{},form:{metode:'kantor'},editingId:null,origQty:null,done:null,lookupWA:'',lookupDone:false,myOrders:[]},
  owner:{authed:false,pin:'',tab:'dash',rekapPO:null,rekapView:'nama',rekapQ:'',rekapGrp:'all',ringPO:'all',dashPO:'all',prodDate:null,prodView:'rekap',payPO:'all',payFilter:'tagih',payMethod:'all',payDest:'all',payFold:{},expPO:null},
};

function render(){
  document.getElementById('hdr-right').innerHTML = MODE==='owner'
    ? `<span class="badge">👩‍🍳 Mode Owner</span>` : '';
  document.getElementById('app').innerHTML = !S.loaded
    ? `<div class="card empty">Memuat…</div>`
    : (MODE==='cust' ? renderCustomer() : renderOwner());
}

async function init(){
  if(MODE==='owner'){S.loaded=true;render();return;}
  render();
  const d=await call('getPublicData');
  if(d){setDB(d);S.loaded=true;}
  else document.getElementById('app').innerHTML=`<div class="card empty">Gagal memuat data.
    <div class="muted" style="margin:8px 0 12px">Pesan error: <b>${esc(lastErr||'tidak diketahui')}</b></div>
    <button class="btn sm" onclick="init()">Coba lagi</button></div>`;
  if(S.loaded) render();
}
async function refreshPublic(){const d=await call('getPublicData');if(d)setDB(d);}

/* ================= CUSTOMER ================= */
function renderCustomer(){
  const c=S.cust;
  if(PAYQ&&!S.payClosed)return payPage();
  let h=`<div class="ctabs">
    <button class="${c.tab==='pesan'?'on':''}" onclick="cTab('pesan')">🛒 Pesan</button>
    <button class="${c.tab==='cek'?'on':''}" onclick="cTab('cek')">🔎 Cek / Edit Pesanan</button>
  </div>`;
  if(c.tab==='cek') return h+renderLookup();
  if(c.done) return h+renderDone();
  h+=`<div class="steps">${[1,2,3,4].map(i=>`<div class="${c.step>=i?'on':''}"></div>`).join('')}</div>`;
  if(c.editingId) h+=`<div class="card" style="background:var(--warn-soft);border-color:#dcc6a6">✏️ Kamu lagi <b>edit pesanan ${esc(c.editingId)}</b>. <a href="#" onclick="cancelEdit();return false">Batal edit</a></div>`;
  if(c.step===1) h+=cStep1();
  if(c.step===2) h+=cStep2();
  if(c.step===3) h+=cStep3();
  if(c.step===4) h+=cStep4();
  return h;
}
function cTab(t){S.cust.tab=t;if(t==='pesan'&&S.cust.done)resetCust();render();}
function resetCust(){Object.assign(S.cust,{step:1,poId:null,qty:{},form:{metode:'kantor'},editingId:null,origQty:null,done:null,reqId:null});}
function cancelEdit(){resetCust();render();}

function cStep1(){
  const open=DB.pos.filter(API.isOpen).sort((a,b)=>a.closeDate.localeCompare(b.closeDate));
  const closed=DB.pos.filter(p=>!API.isOpen(p)).sort((a,b)=>b.closeDate.localeCompare(a.closeDate)).slice(0,3);
  const card=po=>{const o=API.isOpen(po);
    return `<div class="po-card ${S.cust.poId===po.id?'sel':''} ${o?'':'dis'}" ${o?`onclick="pickPO('${po.id}')"`:''}>
      ${po.photo?imgTag(po.photo).replace(' alt=""',' class="po-img" alt="'+esc(po.name)+'"'):''}
      <div class="row between"><b>${esc(po.name)}</b><span class="pill ${o?'open':'closed'}">${o?'Buka':'Sudah close'}</span></div>
      <div class="muted">Close PO: <b>${fd(po.closeDate)}</b><br>Ready: <b>${fd(po.readyDate)}</b></div>
      ${po.note?`<div class="muted" style="margin-top:6px">${esc(po.note)}</div>`:''}
    </div>`};
  return `<div class="card"><h2 style="font-size:20px">1. Pilih PO</h2><p class="muted">Pilih batch PO yang masih buka.</p>
  ${open.length?`<div class="grid2">${open.map(card).join('')}</div>`:`<div class="empty">Belum ada PO yang buka. Tunggu info berikutnya ya 🙏</div>`}
  ${closed.length?`<p class="muted" style="margin-top:16px">PO sebelumnya</p><div class="grid2">${closed.map(card).join('')}</div>`:''}</div>`;
}
function pickPO(id){if(S.cust.poId!==id)S.cust.qty={};S.cust.poId=id;S.cust.step=2;render();}

function cStep2(){
  const po=API.po(S.cust.poId); const c=S.cust;
  if(!po){resetCust();return cStep1();}
  const total=po.items.reduce((s,it)=>s+(c.qty[it.id]||0)*it.price,0);
  const pcs=Object.values(c.qty).reduce((a,b)=>a+b,0);
  const groups={};po.items.forEach(it=>{(groups[it.productId]=groups[it.productId]||[]).push(it)});
  return `<div class="card"><div class="row between"><h2 style="font-size:20px">2. Pilih Produk</h2><span class="muted">${esc(po.name)} · close ${fd(po.closeDate)}</span></div>
  ${Object.entries(groups).map(([pid,its])=>`<h3 style="font-size:16px;margin-top:16px">${esc(API.product(pid)?.name)}</h3>
    ${its.map(it=>{const left=API.left(po,it,c.editingId);const q=c.qty[it.id]||0;
      return `<div class="item"><div><b>${esc(it.variant)}</b><div class="muted">${rp(it.price)} · ${left<=0?'<span class="pill closed">Slot habis</span>':left<=5?`<span class="pill low">Sisa ${left} slot</span>`:`Sisa ${left} slot`}</div></div>
      <div class="stepper"><button ${q<=0?'disabled':''} onclick="chQty('${it.id}',-1)">−</button><span>${q}</span><button ${q>=left?'disabled':''} onclick="chQty('${it.id}',1)">+</button></div></div>`}).join('')}`).join('')}
  </div>
  <div class="sticky"><div class="wrap"><div><div class="muted">${pcs} pcs</div><b style="font-size:18px">${rp(total)}</b></div>
  <div class="row"><button class="btn ghost" onclick="goStep(1)">Kembali</button><button class="btn" ${pcs?'':'disabled'} onclick="goStep(3)">Lanjut</button></div></div></div>`;
}
function chQty(id,d){const po=API.po(S.cust.poId);const it=po.items.find(x=>x.id===id);const left=API.left(po,it,S.cust.editingId);
  const n=Math.max(0,Math.min(left,(S.cust.qty[id]||0)+d));if(n)S.cust.qty[id]=n;else delete S.cust.qty[id];render();}
function goStep(n){S.cust.step=n;render();window.scrollTo(0,0);}

function cStep3(){
  const f=S.cust.form;
  return `<div class="card"><h2 style="font-size:20px">3. Data Pemesan & Pengiriman</h2>
  <div class="grid2"><div><label>Nama</label><input value="${esc(f.nama||'')}" oninput="S.cust.form.nama=this.value" placeholder="Nama lengkap"></div>
  <div><label>No. WhatsApp</label><input value="${esc(f.wa||'')}" oninput="S.cust.form.wa=this.value" inputmode="tel" placeholder="08xxxxxxxxxx"><div class="muted">Dipakai buat cek & edit pesanan nanti</div></div></div>
  <label>Metode</label>
  <div class="seg">
    <button class="${f.metode==='kantor'?'on':''}" onclick="setMetode('kantor')">🏢 Antar ke Kantor<small>Khusus karyawan Lippo & VIVERE</small></button>
    <button class="${f.metode!=='kantor'?'on':''}" onclick="setMetode('antar')">🚚 Kirim / Antar<small>Diantar langsung atau via GoSend, tergantung wilayah</small></button>
  </div>
  ${f.metode==='kantor'?`<div class="grid2"><div><label>PT</label><select onchange="S.cust.form.pt=this.value"><option value="">— Pilih PT —</option>${PT_LIST.map(p=>`<option ${f.pt===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div><label>Divisi</label><input value="${esc(f.divisi||'')}" oninput="S.cust.form.divisi=this.value" placeholder="cth: Finance"></div></div>`
  :`<label>Wilayah</label><select onchange="pickArea(this.value)"><option value="">— Pilih wilayah —</option>${DB.areas.map(a=>`<option value="${a.id}" ${f.metode==='antar'&&f.areaId===a.id?'selected':''}>${esc(a.name)} · ${a.ongkir?'ongkir '+rp(a.ongkir):'gratis ongkir'}</option>`).join('')}
      <option value="__gosend" ${f.metode==='gosend'?'selected':''}>Wilayah lain · via GoSend</option></select>
    ${f.metode==='gosend'?`<div class="muted">Dikirim pakai GoSend, ongkir dibayar ke driver saat barang sampai.</div>`:''}${alamatField(f)}`}
  <label>Pembayaran</label>
  <div class="seg">
    <button class="${f.bayar==='qris'?'on':''}" onclick="setBayar('qris')">📱 Bayar Sekarang (QRIS)<small>Scan QRIS setelah pesan, kirim bukti via WA</small></button>
    <button class="${f.bayar==='nanti'?'on':''}" onclick="setBayar('nanti')">🕒 Bayar Nanti<small>Bayar sesuai info dari admin</small></button>
  </div>
  <label>Jam ambil / kirim (opsional)</label><input type="time" value="${esc(f.jam||'')}" onchange="S.cust.form.jam=this.value" style="max-width:200px"><div class="muted">Kosongkan kalau bebas / ikut jadwal admin.</div>
  <label>Catatan (opsional)</label><input value="${esc(f.catatan||'')}" oninput="S.cust.form.catatan=this.value" placeholder="cth: tulisan di kartu ucapan">
  </div>
  <div class="sticky"><div class="wrap"><span class="muted">Langkah 3 dari 4</span><div class="row"><button class="btn ghost" onclick="goStep(2)">Kembali</button><button class="btn" onclick="validate3()">Cek Pesanan</button></div></div></div>`;
}
function alamatField(f){return `<label>Alamat lengkap</label><textarea rows="3" oninput="S.cust.form.alamat=this.value" placeholder="Jalan, no rumah, patokan, kelurahan, kecamatan">${esc(f.alamat||'')}</textarea>`;}
function setMetode(m){const f=S.cust.form;if(m==='antar'&&f.metode!=='kantor')return;f.metode=m;if(m==='antar')f.areaId='';render();}
function pickArea(v){const f=S.cust.form;if(v==='__gosend'){f.metode='gosend';f.areaId='';}else{f.metode='antar';f.areaId=v;}render();}
function setBayar(b){S.cust.form.bayar=b;render();}
function custOngkir(f){return f.metode==='antar'?(API.area(f.areaId)?.ongkir||0):0;}
function validate3(){const f=S.cust.form;
  if(!f.nama?.trim())return toast('Nama wajib diisi');
  if(normWA(f.wa).length<10)return toast('No. WhatsApp belum valid');
  if(f.metode==='kantor'&&(!f.pt||!f.divisi?.trim()))return toast('PT & divisi wajib diisi');
  if(f.metode==='antar'&&!API.area(f.areaId))return toast('Pilih wilayah dulu');
  if(f.metode!=='kantor'&&!f.alamat?.trim())return toast('Alamat wajib diisi');
  if(!f.bayar)return toast('Pilih pembayaran dulu');
  goStep(4);}

function cStep4(){
  const po=API.po(S.cust.poId);const c=S.cust;const f=c.form;
  const lines=po.items.filter(it=>c.qty[it.id]);
  const sub=lines.reduce((s,it)=>s+it.price*c.qty[it.id],0);
  const ongkir=custOngkir(f);const total=sub+ongkir;
  const shipTitle=f.metode==='kantor'?'Antar ke kantor':f.metode==='antar'?`Kirim/Antar · ${esc(API.area(f.areaId)?.name)}`:'Kirim/Antar · GoSend (ongkir bayar ke driver)';
  return `<div class="card"><h2 style="font-size:20px">4. Cek Ulang Pesanan</h2>
  <p class="muted">${esc(po.name)} · Ready ${fd(po.readyDate)} · bisa diedit sampai ${fd(po.closeDate)}</p>
  <div class="scroll"><table><thead><tr><th>Produk</th><th class="num">Qty</th><th class="num">Harga</th><th class="num">Subtotal</th></tr></thead>
  <tbody>${lines.map(it=>`<tr><td>${esc(API.itemLabel(it))}</td><td class="num">${c.qty[it.id]}</td><td class="num">${rp(it.price)}</td><td class="num">${rp(it.price*c.qty[it.id])}</td></tr>`).join('')}</tbody>
  <tfoot>${f.metode==='antar'?`<tr><td colspan="3">Subtotal</td><td class="num">${rp(sub)}</td></tr><tr><td colspan="3">Ongkir antar</td><td class="num">${ongkir?rp(ongkir):'Gratis'}</td></tr>`:''}<tr><td colspan="3">Total</td><td class="num">${rp(total)}</td></tr></tfoot></table></div>
  <div class="grid2" style="margin-top:14px"><div><div class="muted">Pemesan</div><b>${esc(f.nama)}</b><br>${esc(normWA(f.wa))}</div>
  <div><div class="muted">${shipTitle}</div><b>${f.metode==='kantor'?`${esc(f.pt)} · ${esc(f.divisi)}`:esc(f.alamat)}</b>${f.catatan?`<br><span class="muted">Catatan: ${esc(f.catatan)}</span>`:''}</div>
  <div><div class="muted">Pembayaran</div><b>${f.bayar==='qris'?'📱 Bayar sekarang (QRIS)':'🕒 Bayar nanti'}</b></div>${f.jam?`<div><div class="muted">Jam ambil / kirim</div><b>${esc(f.jam)}</b></div>`:''}</div>

/* ---- QRIS dinamis: library QR dimuat hanya saat dibutuhkan ---- */
var LIBS={};
function loadLib(url){
  if(!LIBS[url])LIBS[url]=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=url;
    sc.onload=()=>res(true);sc.onerror=()=>{delete LIBS[url];rej(new Error('Gagal memuat'));};document.head.appendChild(sc);});
  return LIBS[url];
}
var QR_LIB='ht'+'tps://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode'+'.j'+'s';
var READ_LIB='ht'+'tps://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR'+'.j'+'s';
var qrFailed=false;
function crc16(str){let crc=0xFFFF;for(let i=0;i<str.length;i++){crc^=str.charCodeAt(i)<<8;
  for(let j=0;j<8;j++){crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF;}}
  return ('0000'+crc.toString(16).toUpperCase()).slice(-4);}
function tlvParse(s){const out=[];let i=0;
  while(i<s.length){const id=s.substr(i,2),len=parseInt(s.substr(i+2,2),10);
    if(!/^[0-9][0-9]$/.test(id)||isNaN(len)||i+4+len>s.length)throw new Error('format QRIS');
    out.push([id,s.substr(i+4,len)]);i+=4+len;}
  return out;}
function tlvBuild(arr){return arr.map(x=>x[0]+String(x[1].length).padStart(2,'0')+x[1]).join('');}
function qrisCheck(raw){
  const s=String(raw||'').trim();
  if(!/^000201/.test(s)||!/6304[0-9A-Fa-f]{4}$/.test(s))return null;
  if(crc16(s.slice(0,-4))!==s.slice(-4).toUpperCase())return null;
  try{tlvParse(s.slice(0,-8));return s;}catch(e){return null;}
}
function qrisDynamic(raw,amount){
  const t=tlvParse(raw.trim().slice(0,-8)).filter(x=>x[0]!=='54');
  const p1=t.find(x=>x[0]==='01');if(p1)p1[1]='12';
  const at=t.findIndex(x=>x[0]==='58');const amt=['54',String(Math.round(amount))];
  if(at>=0)t.splice(at,0,amt);else t.push(amt);
  const body=tlvBuild(t)+'6304';
  return body+crc16(body);
}
function qrPng(text){
  const qr=qrcode(0,'M');qr.addData(text);qr.make();
  const n=qr.getModuleCount(),cell=8,pad=cell*4,c=document.createElement('canvas');
  c.width=c.height=n*cell+pad*2;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))g.fillRect(pad+k*cell,pad+r*cell,cell,cell);
  return c.toDataURL('image/png');
}

  if(!DB.qrisPayload||qrFailed)return '';
  if(typeof qrcode!=='function'){loadLib(QR_LIB).then(render,()=>{qrFailed=true;render();});return null;}
  try{return qrPng(qrisDynamic(DB.qrisPayload,amount));}catch(e){return '';}
}

/* ---------- 🔔 Notif pesanan baru / diubah ----------
   Cek otomatis tiap 45 detik selama halaman owner terbuka.
   "Sudah dilihat" disimpan di HP/laptop ini (localStorage). */
const NOTIF_KEY='gy_seen_orders',POLL_MS=45000;
let notifTimer=null,notifAlerted={};
const oTime=o=>String(o.updatedAt||o.createdAt||'');
const oStamp=o=>oTime(o)+'|'+(o.updatedAt?'u':'c')+'|'+o.total+'|'+JSON.stringify(o.items||{});
function seenGet(){try{const s=localStorage.getItem(NOTIF_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function seenSet(m){try{localStorage.setItem(NOTIF_KEY,JSON.stringify(m));}catch(e){}}
function markAllSeen(){const m={};(DB.orders||[]).forEach(o=>m[o.id]=oStamp(o));seenSet(m);notifAlerted={};updateTitle();render();}
function unseenList(){
  const m=seenGet()||{};
  return (DB.orders||[]).filter(o=>m[o.id]!==oStamp(o))
    .map(o=>({o,kind:o.id in m?'ubah':'baru'}))
    .sort((a,b)=>oTime(b.o).localeCompare(oTime(a.o)));
}
function updateTitle(){const n=unseenList().length;document.title=(n?'('+n+') ':'')+'Pre Order GegaresanYuuk';}
function notifStart(){
  if(seenGet()===null)markAllSeen(); // pertama kali login di device ini: anggap semua sudah dilihat
  (DB.orders||[]).forEach(o=>{if(unseenList().some(x=>x.o.id===o.id))notifAlerted[o.id+'|'+oStamp(o)]=1;});
  updateTitle();
  if(notifTimer)clearInterval(notifTimer);
  notifTimer=setInterval(notifPoll,POLL_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)notifPoll();});
}
let polling=false;
async function notifPoll(){
  if(polling||document.hidden||!S.owner.authed)return;polling=true;
  try{
    const j=await viaFetch('ownerGetAll',[S.owner.pin]); // diam-diam, tanpa layar loading
    if(!j||!j.ok)return;
    setDB(j.result);
    const fresh=unseenList().filter(x=>!notifAlerted[x.o.id+'|'+oStamp(x.o)]);
    fresh.forEach(x=>notifAlerted[x.o.id+'|'+oStamp(x.o)]=1);
    updateTitle();
    const a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if(!typing)render();
    if(fresh.length)notifAlert(fresh);
  }finally{polling=false;}
}
function notifAlert(fresh){
  const nb=fresh.filter(x=>x.kind==='baru').length,nu=fresh.length-nb;
  const head=[nb?nb+' pesanan baru':'',nu?nu+' pesanan diubah':''].filter(Boolean).join(' · ');
  const body=fresh.slice(0,3).map(x=>x.o.nama+' – '+rp(oVal(x.o))).join(', ');
  toast('🔔 '+head);
  try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){}
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.12);});}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')new Notification('🍰 '+head,{body:body,tag:'gy-order'});}catch(e){}
}

async function bpMigrate(){const a=bpPhone();if(!a.length)return;
  if(!confirm('Pindahkan '+a.length+' data dari HP ini ke Google Sheet?'))return;
  if(await ownerCall('ownerImportDirect',a.map(x=>Object.assign({},x,{total:bpTotal(x.items)})))){try{localStorage.removeItem('gy_bp_local');}catch(e){}render();toast('✅ Data sudah pindah ke Sheet');}}

function bpAdd(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// item PO (nama produk + varian dari sistem) → unit produksi
function bpMapPO(prod,variant){
  const P=String(prod||''),V=String(variant||''),pv=(P+' '+V).toLowerCase();
  if(/chiffon/i.test(P)){const roll=vUnitOf(P,V)==='roll',u=unitOf(P);
    const flav=V.replace(/\(?\s*(1\s*)?(whole\s*)?roll(\s*utuh)?\s*\)?/ig,' ').replace(/\b(whole|utuh|slice)\b/ig,' ').replace(/\s+/g,' ').trim()||V;
    return {unit:'ch',flav,per:roll?1:1/u};}
  const sz=re=>re.test(pv);
  if(/macaroni|spaghetti/i.test(P)){const k=/spaghetti/i.test(P)?'spg':'mac';
    if(sz(/small|kecil/))return {unit:k,per:1/16};if(sz(/medium|sedang/))return {unit:k,per:1/8};if(sz(/party/))return {unit:k,per:1};}
  if(/dark\s*choco/i.test(P))return {unit:'dcl',per:sz(/slice/)?1/8:1};
  return {unit:'g|'+P+'|'+V,per:1,gen:{n:P+(V?' · '+V:''),ic:'🧁',u:'pcs'}};
}
// semua "baris kebutuhan" dari PO + lokal: {o, date(ambil), unit, flav, need, label, q}
function bpRows(){
  const out=[];
  (DB.orders||[]).forEach(o=>{const po=API.po(o.poId);if(!po)return;
    const O={src:'po',id:o.id,nama:o.nama,date:po.readyDate,jam:o.jam||'',to:o.metode==='kantor'?'🏢 '+o.pt+' · '+o.divisi:'🚚 '+API.shipLabel(o).replace('Kirim/Antar · ',''),paid:isLunas(o),note:o.catatan||'',items:[]};
    Object.entries(o.items||{}).forEach(([iid,q])=>{const it=po.items.find(x=>x.id===iid);if(!it)return;
      const prod=API.product(it.productId)?.name||'?',m=bpMapPO(prod,it.variant);O.items.push(prod+' '+it.variant+' ×'+q);
      out.push({o:O,unit:m.unit,flav:m.flav||'',need:q*m.per,gen:m.gen,label:prod+' '+it.variant,q});});});
  bpLocal().forEach(L=>{const O=Object.assign({},L,{items:L.items.map(([p,s,f,q])=>p+' '+s+(f?' '+f:'')+' ×'+q)});
    L.items.forEach(([p,s,f,q])=>{const m=BP_MENU.find(x=>x.p===p),z=m&&m.s.find(x=>x[0]===s);if(!z)return;
      out.push({o:O,unit:z[2],flav:BP_U[z[2]].flav?f:'',need:q*(z[2]==='ch'&&z[3]<1?1/bpChU():z[3]),label:p+' '+s+(f?' '+f:''),q});});});
  return out;
}
const bpChU=()=>unitOf(((DB.products||[]).find(p=>/chiffon/i.test(p.name))||{name:'Chiffon Roll'}).name);
const bpBakeDate=o=>o.src==='st'?o.date:bpAdd(o.date,-bpLead());
function bpPlan(rows){
  const g={};
  rows.forEach(r=>{const key=r.unit+(r.flav?'|'+r.flav:'');const x=g[key]=g[key]||{key,unit:r.unit,flav:r.flav,d:r.gen||BP_U[r.unit],need:0,src:[]};x.need+=r.need;x.src.push(r);});
  return Object.values(g).map(r=>{const d=r.d;let bake,extra='',sisa='';
    if(d.sl){const sl=r.unit==='ch'?bpChU():d.sl;
      bake=Math.ceil(r.need-1e-9);const left=Math.round((bake-r.need)*sl);extra=Math.round(r.need*sl)+' slice dibutuhkan';if(left>0)sisa=left+' slice sisa → ready stock';}
    else if(d.per){bake=Math.ceil(r.need/d.per-1e-9);const left=Math.round(bake*d.per-r.need);extra=Math.round(r.need)+' pcs';if(left>0)sisa=left+' pcs sisa';}
    else if(d.u==='resep'){bake=Math.ceil(r.need-1e-9);extra=Math.round(r.need*100)+'% kapasitas';const left=bake-r.need;
      if(left>1e-9)sisa='sisa adonan ≈ '+Math.floor(left*16+1e-9)+' small / '+Math.floor(left*8+1e-9)+' medium';}
    else bake=Math.round(r.need*100)/100;
    const first=r.src.map(x=>(x.o.src==='st'?'':x.o.date+' ')+(x.o.jam||'99:99')).sort()[0]||'';
    return Object.assign(r,{bake,extra,sisa,first,name:d.n+(r.flav?' · '+r.flav:'')});
  }).sort((a,b)=>a.first.localeCompare(b.first)||a.name.localeCompare(b.name));
}

    if(tl.length)h+=`<div class="card"><h3 style="font-size:17px">🕑 Urutan ambil / kirim</h3><div class="muted">${bpFdl(bpAdd(day,lead))} · buat packing</div><div class="bptl" style="margin-top:8px">${tl.map(o=>`<div class="bptli"><span class="h">${o.jam||'—'}</span> · <b>${esc(o.nama)}</b> ${bpTag(o.src)} ${o.paid?'<span class="bptag st">Lunas</span>':'<span class="bptag red">Belum bayar</span>'}

// pengenal sederhana dari chat WA
function bpParse(){const F=BPF,raw=F.paste||'',t=raw.toLowerCase();if(!t.trim())return toast('Tempel chat dulu');
  const nm=raw.match(/\b(?:aku|saya|nama(?:ku)?)\s+([A-Z][a-zA-Z]+)/)||raw.match(/\b(?:aku|saya)\s+([a-z]+)/i);if(nm&&!/mau|pesen|pesan|order/i.test(nm[1]))F.nama=nm[1][0].toUpperCase()+nm[1].slice(1);
  const wa=raw.match(/(?:\+?62|0)8[\d\s-]{8,13}/);if(wa)F.wa=wa[0].replace(/[\s-]/g,'');
  const N='(\\d+)';const found=[];
  const tryAdd=(p,s,f,res)=>{for(const re of res){const mm=t.match(re);if(mm){found.push([p,s,f,+(mm[1]||1)]);return;}}};
  tryAdd('Dark Choco Layer','Slice','',[new RegExp('dark\\s*choco\\w*[^\\d]{0,12}'+N+'\\s*slice'),new RegExp(N+'\\s*slice\\s*dark\\s*choco')]);
  tryAdd('Dark Choco Layer','Loaf 22x10','',[new RegExp('dark\\s*choco\\w*[^\\d]{0,12}'+N+'\\s*loaf'),new RegExp(N+'\\s*loaf\\s*dark')]);
  [['20x20cm','20x20'],['20x10cm','20x10'],['15x10cm','15x10'],['10x10cm','10x10']].forEach(([s,k])=>tryAdd('Brownies',s,'',[new RegExp('brownies\\s*'+k+'\\s*'+N),new RegExp(N+'\\s*brownies\\s*'+k)]));
  ['Double Cheese','Mocca','Pandan Srikaya','Pandan Kelapa'].forEach(f=>{const k=f.toLowerCase();
    tryAdd('Chiffon Roll','Whole roll',f,[new RegExp(k+'[^\\d]{0,10}'+N+'\\s*roll'),new RegExp(N+'\\s*roll\\s*(?:chiffon\\s*)?'+k)]);
    tryAdd('Chiffon Roll','Slice',f,[new RegExp(k+'[^\\d]{0,10}'+N+'\\s*slice'),new RegExp(N+'\\s*slice\\s*(?:chiffon\\s*)?'+k)]);});
  ['Original','Matcha','Cookie Monster','Double Choco'].forEach(f=>{const k=f.toLowerCase();tryAdd('Soft Cookies','pcs',f,[new RegExp('cookies?\\s*'+k+'\\s*'+N),new RegExp(N+'\\s*(?:pcs\\s*)?(?:soft\\s*)?cookies?\\s*'+k)]);});
  [['Small','small|kecil'],['Medium','medium|sedang'],['Party Pack','party\\s*pack|party']].forEach(([s,k])=>{
    tryAdd('Macaroni Schotel',s,'',[new RegExp('macaroni\\w*\\s*(?:'+k+')\\s*'+N),new RegExp(N+'\\s*(?:'+k+')\\s*macaroni'),new RegExp('makaroni\\w*\\s*(?:'+k+')\\s*'+N)]);
    tryAdd('Spaghetti Brulee',s,'',[new RegExp('spag\\w*\\s*(?:brulee\\s*)?(?:'+k+')\\s*'+N),new RegExp(N+'\\s*(?:'+k+')\\s*spag')]);});
  found.forEach(x=>{if(BP_MENU.find(m=>m.p===x[0]).s.some(z=>z[0]===x[1]))F.items.push(x);});
  const days=['minggu','senin','selasa','rabu','kamis','jumat','sabtu'];const di=days.findIndex(d=>new RegExp('\\b'+d+'\\b').test(t.replace("jum'at",'jumat')));
  if(di>=0){let d=DB.today;for(let i=1;i<=7;i++){const c=bpAdd(DB.today,i);if(new Date(c+'T00:00:00').getDay()===di){d=c;break;}}F.date=d;}
  else if(/\bbesok\b/.test(t))F.date=bpAdd(DB.today,1);else if(/\blusa\b/.test(t))F.date=bpAdd(DB.today,2);
  const j=t.match(/jam\s*(\d{1,2})(?:[.:](\d{2}))?/);if(j){let hh=+j[1];if(/sore|malam/.test(t)&&hh<12)hh+=12;if(/siang/.test(t)&&hh<6)hh+=12;F.jam=String(hh).padStart(2,'0')+':'+(j[2]||'00');}
  if(/vivere/.test(t))F.to='🏢 VIVERE';else if(/lippo/.test(t))F.to='🏢 Lippo';else if(/gosend|gojek/.test(t))F.to='🛵 GoSend';
  toast(found.length?'✨ Terisi otomatis, cek lagi ya':'Produk belum kebaca, pilih manual ya');bpModal();}

async function shareQris(id){

  const bin=atob(url.split(',')[1]),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);

// gambar QRIS + keterangan nominal & kode, sebagai Blob PNG
function qrisCardBlob(o){
  return new Promise((res,rej)=>{try{
    const amt=Math.round(oVal(o)),qr=qrcode(0,'M');qr.addData(qrisDynamic(DB.qrisPayload,amt));qr.make();
    const n=qr.getModuleCount(),cell=8,pad=32,W=n*cell+pad*2,H=W+96,c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))g.fillRect(pad+k*cell,pad+r*cell,cell,cell);
    g.textAlign='center';g.fillStyle='#5a3a28';g.font='bold 34px sans-serif';g.fillText(rp(amt),W/2,W+30);
    g.fillStyle='#8c7a6b';g.font='20px sans-serif';g.fillText(o.id+' · '+(DB.qrisMerchant||'GegaresanYuuk'),W/2,W+66);
    c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png');
  }catch(e){rej(e);}});
}

function csvSafe(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}

function pickPOPhoto(inp){
  const f=inp.files&&inp.files[0];
  if(!f)return;
  if(!/^image\//.test(f.type))return toast('File harus gambar');
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,900/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      let q=0.8,url=c.toDataURL('image/jpeg',q);
      while(url.length>250000&&q>0.4){q-=0.1;url=c.toDataURL('image/jpeg',q);}
      draft.photo=url;draft.photoChanged=true;renderModal();toast('Foto siap, klik Simpan PO');
    };
    im.onerror=()=>toast('Gambar tidak bisa dibaca');
    im.src=rd.result;};
  rd.readAsDataURL(f);
}

  if(!ok)return toast('Kode QRIS tidak valid');

function decodeQR(dataUrl){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      for(const max of [1000,700,1600,400]){
        const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
        const r=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});
        if(r&&r.data)return res(r.data);
      }
      res(null);
    };
    im.onerror=()=>res(null);im.src=dataUrl;
  });
}
function uploadQris(){
  const f=document.getElementById('qrisFile').files[0];
  if(!f)return toast('Pilih gambar QRIS dulu');
  const rd=new FileReader();
  rd.onload=async()=>{
    try{await loadLib(READ_LIB);}catch(e){return toast('Gagal memuat pembaca QR, coba tempel kodenya');}
    const txt=await decodeQR(rd.result);
    if(!txt)return toast('Kode QR belum terbaca, coba gambar lebih jelas');
    saveQrisCode(txt);
  };
  rd.readAsDataURL(f);
}

      h+=`<div class="card bawa"><div class="row between"><b>🧺 Bawaan ${o.rekapGrp==='kirim'?'Kirim/Antar':'ke '+esc(o.rekapGrp.slice(3))}</b><span class="pill ${nP===list.length?'open':'low'}">📦 ${nP}/${list.length} siap</span></div>
        <div class="muted" style="margin-top:2px">${list.length} pesanan · ${list.reduce((s,x)=>s+oPcs(x),0)} pcs</div>
        <div class="bw">${Object.entries(sum).map(([i,n])=>`<span>${esc(lbl(i))} <b>×${n}</b></span>`).join('')}</div></div>`;
    }
    h+=`<div class="row between" style="margin:2px 2px 10px;flex-wrap:nowrap"><input placeholder="🔍 Cari nama / kode / no. WA" value="${esc(o.rekapQ||'')}" oninput="rekapFind(this.value)" style="flex:1">
      ${o.rekapGrp==='all'?`<span class="pill ${nPacked===orders.length?'open':'low'}" style="flex-shrink:0">📦 ${nPacked}/${orders.length} siap</span>`:''}</div>`;
    const sub=x=>x.metode==='kantor'?(x.divisi||'').toLowerCase():'';
    let lastSub=null;
    h+=[...list].sort((a,b)=>o.rekapGrp.indexOf('pt:')===0?(sub(a).localeCompare(sub(b))||(isPacked(a)-isPacked(b))||a.nama.localeCompare(b.nama)):((isPacked(a)-isPacked(b))||a.nama.localeCompare(b.nama))).map(od=>{
      let hd='';if(o.rekapGrp.indexOf('pt:')===0&&sub(od)!==lastSub){lastSub=sub(od);hd=`<div class="divh">📍 ${esc(od.divisi)}</div>`;}
      const p=pack[od.id]||{},keys=Object.keys(od.items),done=keys.filter(k=>p[k]).length,ready=done===keys.length,l=isLunas(od);
      const key=(od.nama+' '+od.id+' '+od.wa).toLowerCase();
      return hd+`<div class="ord ${ready?'ready':''}" data-n="${esc(key)}" style="${q&&key.indexOf(q)<0?'display:none':''}">
        <div class="ord-h"><div><b>${esc(od.nama)}</b> <span class="ocode">${esc(od.id)}</span></div><span class="pill ${l?'open':'red'}">${l?'Lunas':'Belum bayar'}</span></div>
        <div class="ship">${od.metode==='kantor'?'🏢':'🚚'} <span>${esc(API.shipLabel(od))}${od.alamat?' · '+esc(od.alamat):''}${od.jam?' · ⏰ '+esc(od.jam):''}</span></div>
        <div class="items">${keys.map(k=>`<div class="it ${p[k]?'on':''}" onclick="packToggle('${od.id}','${k}')"><div class="box">${p[k]?'✓':''}</div><div class="nm">${esc(lbl(k))}</div><div class="q">×${od.items[k]}</div></div>`).join('')}</div>
        ${od.catatan?`<div class="note">📝 ${esc(od.catatan)}</div>`:''}
        <div class="ord-f"><div class="prog"><span class="muted">${ready?'✅ Siap diantar':'Dikemas '+done+'/'+keys.length}</span><div class="bar"><i style="width:${keys.length?done/keys.length*100:0}%"></i></div></div>
          <b>${rp(oVal(od))}</b></div>
        <div class="ord-a">${ready?`<button class="btn sm ghost" onclick="packAll('${od.id}',false)">↺ Reset</button>`:`<button class="btn sm ghost" onclick="packAll('${od.id}',true)">📦 Dikemas</button>`}
          <button class="btn sm ghost" onclick="ownerCall('ownerSetPaid','${od.id}',${!l})">${l?'Batal lunas':'✓ Lunas'}</button>
          ${linkTag(chatUrl(od),'btn sm ghost','💬 Chat')}
          <button class="btn sm ghost del" onclick="delOrder('${od.id}')">✕</button></div>
      </div>`}).join('');
    h+=`<p class="muted" style="text-align:center">Centang item saat dikemas. Centangan tersimpan di HP/laptop ini.</p>`;
  }
  if(o.rekapView==='varian'){
    let tq=0,tr=0;
    h+=`<div class="card">${po.items.map(it=>{const q=API.sold(po.id,it.id);tq+=q;tr+=q*it.price;const left=it.slot-q;
      return `<div class="vrow"><div class="row between" style="flex-wrap:nowrap"><div><b>${esc(API.itemLabel(it))}</b><div class="muted">${rp(it.price)} · slot ${it.slot} · ${left<=0?'<b style="color:var(--red)">habis</b>':'sisa '+left}</div></div>
        <div style="text-align:right"><div class="big">${q}</div><div class="muted">${rp(q*it.price)}</div></div></div>
        <div class="pbar"><i style="width:${it.slot?Math.min(100,q/it.slot*100):0}%"></i></div></div>`}).join('')}
      <div class="row between vtot"><b>Total</b><b>${tq} pcs · ${rp(tr)}</b></div></div>`;
  }
  if(o.rekapView==='pt'){
    const groups=[['🏢 Antar ke Kantor',orders.filter(x=>x.metode==='kantor'),x=>x.pt+' · '+x.divisi],
      ['🚚 Diantar sendiri',orders.filter(x=>x.metode==='antar'),x=>API.areaName(x)],
      ['🛵 GoSend',orders.filter(x=>x.metode==='gosend'),()=>'Wilayah lain']];
    groups.forEach(([title,list,keyFn])=>{
      if(!list.length)return;
      const g={};list.forEach(x=>{(g[keyFn(x)]=g[keyFn(x)]||[]).push(x)});
      h+=`<div class="grp"><h3>${title}</h3><span class="muted">${list.length} pesanan</span></div>`;
      h+=Object.keys(g).sort().map(k=>{const os=g[k];const sum={};os.forEach(x=>Object.entries(x.items).forEach(([i,q])=>sum[i]=(sum[i]||0)+q));
        return `<div class="card"><div class="row between"><b>📍 ${esc(k)}</b><span class="muted">${os.length} org</span></div>
          <div class="muted" style="margin-top:2px">${Object.entries(sum).map(([i,q])=>esc(lbl(i))+' <b style="color:var(--ink)">×'+q+'</b>').join(' · ')}</div>
          ${os.map(x=>`<div class="sp"><div class="row between" style="flex-wrap:nowrap"><b>${esc(x.nama)}</b><span class="muted">${esc(x.wa)}</span></div>
            ${x.alamat?`<div class="muted">🏠 ${esc(x.alamat)}</div>`:''}
            <div style="font-size:14px">${Object.entries(x.items).map(([i,q])=>esc(lbl(i))+' ×'+q).join(', ')}</div>
            ${x.catatan?`<div class="note">📝 ${esc(x.catatan)}</div>`:''}</div>`).join('')}</div>`}).join('');
    });
  }
  return h;
}
function delOrder(id){if(confirm('Hapus pesanan '+id+'?'))ownerCall('ownerDeleteOrder',id);}
function exportCSV(){
  const po=API.po(S.owner.rekapPO);const os=API.ordersOf(po.id);
  const head=['Kode','Nama','WA','Metode','PT','Divisi','Wilayah','Alamat','Catatan',...po.items.map(API.itemLabel),'Subtotal','Ongkir','Total','Pembayaran','Status Bayar'];
  const rows=os.map(o=>[o.id,o.nama,o.wa,METODE[o.metode],o.pt,o.divisi,o.metode==='antar'?API.areaName(o):'',o.alamat,o.catatan,...po.items.map(it=>o.items[it.id]||0),o.subtotal,o.ongkir||0,o.total,o.bayar==='qris'?'QRIS':'Bayar nanti',o.statusBayar==='lunas'?'Lunas':'Belum']);
  const csv=[head,...rows].map(r=>r.map(csvSafe).join(',')).join(String.fromCharCode(10));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=`rekap-${po.name}.csv`;document.body.appendChild(a);a.click();a.remove();
}

init();
</script>
</body>
