<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baking Plan · GegaresanYuuk (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe6;--card:#fffdf9;--ink:#3e2c22;--muted:#8c7a6b;--line:#e6d8c6;--brand:#7a5236;--brand-2:#a98466;--brand-soft:#efe4d6;
--ok:#5f7a4a;--ok-soft:#e6ecdc;--warn:#9a6b2f;--warn-soft:#f2e7d3;--red:#8e3b2e;--red-soft:#f6e0db;--blue:#3d5a7a;--blue-soft:#e6ecf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 90px}
header{background:linear-gradient(90deg,var(--brand),var(--brand-2));color:#fff;padding:22px 0}header .wrap{padding-bottom:0}
header h1{color:#fff;font-size:20px;line-height:1.2}header small{opacity:.85;display:block;margin-top:4px;font-size:13.5px}
.badge{display:inline-block;background:rgba(255,255,255,.2);padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;margin-top:8px}
main.wrap{margin-top:16px}
.mock{background:#fff7e0;border:1px dashed #d9b86a;border-radius:12px;padding:8px 12px;font-size:12.5px;color:#7a5a1c;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs button{flex-shrink:0;border:1.5px solid var(--line);background:#fff;padding:8px 13px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid #ece2d4;border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(80,55,35,.07);margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.seg2{display:flex;background:var(--brand-soft);border-radius:999px;padding:3px;margin-top:12px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;font-weight:600;font-size:13px;cursor:pointer;color:var(--brand);white-space:nowrap}
.seg2 button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.chips button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;text-align:center;line-height:1.25}
.chips button b{display:block;font-size:15px}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand-2);margin-top:2px}
.chips button.on .dot{background:#fff}
.btn{border:0;background:var(--brand);color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:6px 12px;font-size:13px}
.addbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:11.5px}.kpi b{display:block;font-family:"Playfair Display",serif;font-size:20px;color:var(--brand);line-height:1.2}
/* kartu produksi */
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.pc .hd{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none}
.pc .ic{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.pc .nm{flex:1;min-width:0}.pc .nm b{display:block;font-size:15.5px}
.pc .bake{text-align:right;white-space:nowrap}.pc .bake b{display:block;font-family:"Playfair Display",serif;font-size:21px;color:var(--brand);line-height:1.1}.pc .bake small{font-size:12px;color:var(--muted)}
.pc .chk{width:26px;height:26px;border:2px solid var(--brand-2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;cursor:pointer}
.pc.done{opacity:.6}.pc.done .chk{background:var(--ok);border-color:var(--ok)}.pc.done .nm b{text-decoration:line-through}
.pc .src{border-top:1px dashed var(--line);padding:6px 14px 10px;background:#fffdfa}
.pc .s{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13.5px;border-bottom:1px dashed #f0e6d8}.pc .s:last-child{border-bottom:0}
.pc .s .t{font-weight:700;min-width:44px;color:var(--brand)}.pc .s .w{flex:1;min-width:0}.pc .s .q{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:1px;margin-left:4px}
.tag.po{background:var(--blue-soft);color:var(--blue)}.tag.ls{background:var(--warn-soft);color:var(--warn)}.tag.st{background:var(--ok-soft);color:var(--ok)}
.sisa{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-top:2px}
.meter{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;background:var(--brand-2)}
.ask{background:var(--warn-soft);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--warn);margin-top:6px}
/* timeline ambil */
.tl{position:relative;padding-left:18px}.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;padding:6px 0 10px}.tli:before{content:"";position:absolute;left:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--brand-2);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tli .h{font-weight:700;color:var(--brand)}
/* minggu */
.day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.day .dl{display:flex;justify-content:space-between;align-items:center}.day .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{display:inline-block;background:var(--brand-soft);border-radius:999px;padding:3px 9px;font-size:12px}.pill b{color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:16px}
.tot{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}.tot:last-child{border-bottom:0}
.tot b.n{font-family:"Playfair Display",serif;font-size:18px;color:var(--brand)}
.shop{background:var(--brand-soft);border-radius:14px;padding:12px;margin-top:10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 24px}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:22px}}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:2fr 2fr 1fr;gap:6px}
.paste{background:var(--blue-soft);border-radius:14px;padding:10px 12px;margin-top:6px}
.itl{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40}
</style></head><body>
<header><div class="wrap"><h1>🍰 Pre Order GegaresanYuuk</h1><small>Homemade cakes · pesan duluan, dibuat fresh</small><span class="badge">👩‍🍳 Mode Owner</span></div></header>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<script>
/* ===== MENU: yang dijual → yang dipanggang ===== */
// unit produksi: apa yang benar-benar dipanggang
const U={
  mac:{n:'Macaroni Schotel',ic:'🧀',u:'resep'}, spg:{n:'Spaghetti Brulee',ic:'🍝',u:'resep',ask:'Asumsi sama dengan Macaroni: 1 resep = 8 medium / 1 party pack. Betul?'},
  br2020:{n:'Brownies 20x20',ic:'🍫',u:'loyang',egg:2}, br2010:{n:'Brownies 20x10',ic:'🍫',u:'loyang',egg:1},
  br1510:{n:'Brownies 15x10',ic:'🍫',u:'loyang',ask:'Butuh berapa telur?'}, br1010:{n:'Brownies 10x10',ic:'🍫',u:'loyang',ask:'Butuh berapa telur?'},
  bncup:{n:'Banana Cake cup',ic:'🍌',u:'cup'}, bn1510:{n:'Banana Cake 15x10',ic:'🍌',u:'loyang'}, bn2010:{n:'Banana Cake 20x10',ic:'🍌',u:'loyang'},
  baby:{n:'Baby Burnt Cheesecake',ic:'🍮',u:'pcs'}, cc10:{n:'Cheesecake d10',ic:'🍰',u:'pcs'}, cc15:{n:'Cheesecake d15',ic:'🍰',u:'pcs'},
  cc20:{n:'Cheesecake d20',ic:'🍰',u:'round',sl:8}, bcc:{n:'Brownies Cheesecake loaf',ic:'🍰',u:'loaf',sl:8},
  dcl:{n:'Dark Choco Layer loaf',ic:'🍫',u:'loaf',sl:8},
  ck:{n:'Soft Cookies',ic:'🍪',u:'adonan',per:20,flav:1,ask:'1 adonan (20 pcs) itu per rasa, atau 1 adonan base dibagi ke beberapa rasa?'},
  ch:{n:'Chiffon Roll',ic:'🍥',u:'roll',sl:10,flav:1},
  bday:{n:'Birthday Cheesecake (custom)',ic:'🎂',u:'pcs'},
};
// menu jual: kategori → produk → ukuran {harga, unit produksi, berapa per 1 qty}
const MENU=[
 {cat:'Savory',p:'Macaroni Schotel',s:[['Small',10000,'mac',1/16],['Medium',22000,'mac',1/8],['Party Pack',145000,'mac',1]]},
 {cat:'Savory',p:'Spaghetti Brulee',s:[['Medium',25000,'spg',1/8],['Party Pack',160000,'spg',1]]},
 {cat:'Sweet',p:'Brownies',s:[['10x10cm',35000,'br1010',1],['15x10cm',50000,'br1510',1],['20x10cm',65000,'br2010',1],['20x20cm',125000,'br2020',1]]},
 {cat:'Sweet',p:'Banana Cake',s:[['Cup isi 5',25000,'bncup',5],['15x10cm',45000,'bn1510',1],['20x10cm',60000,'bn2010',1]]},
 {cat:'Sweet',p:'Cheesecake',s:[['Baby burnt isi 4',42000,'baby',4],['Diameter 10cm',58000,'cc10',1],['Diameter 15cm',165000,'cc15',1],['Diameter 20cm',300000,'cc20',1],['Slice d20',38000,'cc20',1/8],['Brownies cheesecake 22x10',200000,'bcc',1],['Slice brownies cheesecake',26000,'bcc',1/8],['Birthday cheesecake',0,'bday',1]]},
 {cat:'Sweet',p:'Soft Cookies',f:['Original','Matcha','Cookie Monster','Double Choco'],fp:{Original:12000,Matcha:16000,'Cookie Monster':16000,'Double Choco':18000},s:[['pcs',0,'ck',1]]},
 {cat:'Sweet',p:'Dark Choco Layer',s:[['Loaf 22x10',220000,'dcl',1],['Slice',28000,'dcl',1/8]]},
 {cat:'Sweet',p:'Chiffon Roll',f:['Double Cheese','Mocca','Pandan Srikaya','Pandan Kelapa'],s:[['Whole roll',150000,'ch',1],['Slice',15000,'ch',1/10]]},
];
const findSize=(p,s)=>{const m=MENU.find(x=>x.p===p);const z=m.s.find(x=>x[0]===s);return {price:z[1],unit:z[2],per:z[3],m};};

/* ===== contoh data (minggu ini) ===== */
const D=(d)=>'2026-10-'+String(d).padStart(2,'0'), D11=(d)=>'2026-11-'+String(d).padStart(2,'0');
let ORD=[ // src: po | ls (langsung) | st (ready stock)
 {id:'L-101',src:'ls',nama:'Bu Sari',date:D(20),jam:'16:00',to:'🏢 VIVERE',items:[['Dark Choco Layer','Loaf 22x10','',1]],paid:false},
 {id:'L-102',src:'ls',nama:'Rina',date:D(20),jam:'17:00',to:'🚚 Lippo Karawaci',items:[['Chiffon Roll','Whole roll','Pandan Kelapa',1]],paid:true},
 {id:'S-01',src:'st',nama:'Ready stock',date:D(20),jam:'',to:'Dijual di kantor',items:[['Dark Choco Layer','Slice','',6]]},
 {id:'L-103',src:'ls',nama:'Dewi',date:D(21),jam:'10:00',to:'🏢 Lippo · HR',items:[['Brownies','20x20cm','',1],['Brownies','10x10cm','',2]],paid:false},
 {id:'L-104',src:'ls',nama:'Andi',date:D(21),jam:'13:00',to:'🏢 VIVERE',items:[['Cheesecake','Slice d20','',11],['Cheesecake','Diameter 15cm','',1]],paid:true},
 {id:'L-105',src:'ls',nama:'Maya',date:D(21),jam:'12:00',to:'🛵 GoSend',items:[['Macaroni Schotel','Small','',6],['Macaroni Schotel','Medium','',2]],paid:false},
 {id:'GY-7A1',src:'po',nama:'Evita',date:D(22),jam:'08:00',to:'🏢 Lippo · HR',items:[['Chiffon Roll','Slice','Pandan Srikaya',7],['Chiffon Roll','Slice','Mocca',7],['Chiffon Roll','Whole roll','Double Cheese',1]],paid:false},
 {id:'GY-7B2',src:'po',nama:'Lina',date:D(22),jam:'08:00',to:'🏢 VIVERE',items:[['Chiffon Roll','Slice','Pandan Srikaya',5],['Chiffon Roll','Slice','Mocca',2]],paid:true},
 {id:'GY-7C3',src:'po',nama:'Nadia',date:D(22),jam:'12:00',to:'🏢 Lippo · Finance',items:[['Macaroni Schotel','Medium','',3]],paid:true},
 {id:'L-106',src:'ls',nama:'Lina',date:D(23),jam:'15:00',to:'🏢 VIVERE',items:[['Soft Cookies','pcs','Original',6],['Soft Cookies','pcs','Matcha',4],['Soft Cookies','pcs','Cookie Monster',5],['Soft Cookies','pcs','Double Choco',8]],paid:false},
 {id:'S-02',src:'st',nama:'Ready stock',date:D(23),jam:'',to:'Dijual di kantor',items:[['Soft Cookies','pcs','Double Choco',12]]},
 {id:'L-107',src:'ls',nama:'Pak Budi',date:D(24),jam:'18:00',to:'🚚 Cikokol',items:[['Spaghetti Brulee','Party Pack','',1],['Macaroni Schotel','Party Pack','',1]],paid:false},
 {id:'L-108',src:'ls',nama:'Tari',date:D(24),jam:'11:00',to:'🛵 GoSend',items:[['Cheesecake','Baby burnt isi 4','',2]],paid:true},
 {id:'L-109',src:'ls',nama:'Wulan',date:D(27),jam:'09:00',to:'🏢 Lippo · IT',items:[['Banana Cake','Cup isi 5','',2]],paid:false},
 {id:'L-110',src:'ls',nama:'Sinta',date:D(28),jam:'16:00',to:'🚚 Lippo Karawaci',items:[['Cheesecake','Birthday cheesecake','',1]],note:'d20, tulisan "HBD Mama", topping strawberry',paid:false},
 {id:'GY-8A1',src:'po',nama:'(PO Macaroni Batch #2 · 9 order)',date:D(30),jam:'08:00',to:'🏢 Kantor',items:[['Macaroni Schotel','Small','',22],['Macaroni Schotel','Medium','',9]],paid:false},
 {id:'L-111',src:'ls',nama:'Ratna',date:D11(1),jam:'10:00',to:'🛵 GoSend',items:[['Dark Choco Layer','Slice','',4],['Brownies','20x10cm','',1]],paid:false},
];
const TODAY=D(20);
const S={view:'hari',day:TODAY,open:{},done:{},range:7};

/* ===== hitung baking plan ===== */
function plan(orders){
  const g={};
  orders.forEach(o=>o.items.forEach(([p,s,f,q])=>{
    const z=findSize(p,s),u=z.unit,key=u+(U[u].flav?'|'+f:'');
    const r=g[key]=g[key]||{key,u,f,need:0,src:[]};
    r.need+=q*z.per;r.src.push({o,label:p+' '+s+(f?' '+f:''),q});
  }));
  return Object.values(g).map(r=>{const d=U[r.u];let bake,unitLbl=d.u,extra='',sisa='';
    if(d.sl){bake=Math.ceil(r.need-1e-9);const sl=Math.round((bake-r.need)*d.sl);if(sl>0)sisa=sl+' slice sisa → ready stock';
      extra=Math.round(r.need*d.sl)+' slice dibutuhkan';}
    else if(d.per){bake=Math.ceil(r.need/d.per);const left=bake*d.per-r.need;extra=r.need+' pcs';if(left>0)sisa=left+' pcs sisa';}
    else if(d.u==='resep'){bake=Math.ceil(r.need-1e-9);extra=Math.round(r.need*100)+'% kapasitas';const left=bake-r.need;
      if(left>1e-9)sisa='sisa adonan ≈ '+Math.floor(left*16+1e-9)+' small / '+Math.floor(left*8+1e-9)+' medium';}
    else {bake=r.need;}
    const first=r.src.map(x=>x.o.jam).filter(Boolean).sort()[0]||'99:99';
    return Object.assign(r,{d,bake,unitLbl,extra,sisa,first,name:d.n+(r.f?' · '+r.f:'')});
  }).sort((a,b)=>a.first.localeCompare(b.first)||a.name.localeCompare(b.name));
}
const fd=s=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});};
const fdl=s=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag=src=>src==='po'?'<span class="tag po">PO</span>':src==='ls'?'<span class="tag ls">Langsung</span>':'<span class="tag st">Stok</span>';

function pcard(r,dayKey){
  const k=dayKey+'|'+r.key,dn=S.done[k],op=S.open[k];
  const egg=r.d.egg?` · 🥚 ${r.d.egg*r.bake} telur`:'';
  return `<div class="pc ${dn?'done':''}">
    <div class="hd" onclick="tog('${k}')">
      <div class="chk" onclick="event.stopPropagation();S.done['${k}']=!S.done['${k}'];render()">${dn?'✓':''}</div>
      <div class="ic">${r.d.ic}</div>
      <div class="nm"><b>${esc(r.name)}</b><span class="muted">${r.extra?esc(r.extra):r.src.length+' pesanan'}${egg} · mulai ${r.first==='99:99'?'—':r.first}</span>
        ${r.sisa?`<div><span class="sisa">${esc(r.sisa)}</span></div>`:''}${r.d.ask?`<div class="ask">❓ ${r.d.ask}</div>`:''}</div>
      <div class="bake"><b>${r.bake}</b><small>${r.unitLbl}</small></div>
    </div>
    ${op?`<div class="src">${r.src.map(x=>`<div class="s"><span class="t">${x.o.jam||'—'}</span><span class="w">${esc(x.o.nama)} ${tag(x.o.src)}<div class="muted">${esc(x.label)}${x.o.note?' · 📝 '+esc(x.o.note):''}</div></span><span class="q">×${x.q}</span></div>`).join('')}</div>`:''}
  </div>`;
}
function tog(k){S.open[k]=!S.open[k];render();}

function vDay(){
  const days=[...Array(14)].map((_,i)=>addDays(TODAY,i));
  const os=ORD.filter(o=>o.date===S.day),P=plan(os);
  const nPes=os.filter(o=>o.src!=='st').length,nSt=os.filter(o=>o.src==='st').length;
  let h=`<div class="chips">${days.map(d=>{const has=ORD.some(o=>o.date===d);const dt=new Date(d+'T00:00:00');
    return `<button class="${S.day===d?'on':''}" onclick="S.day='${d}';render()">${dt.toLocaleDateString('id-ID',{weekday:'short'})}<b>${dt.getDate()}</b>${has?'<span class="dot"></span>':'&nbsp;'}</button>`}).join('')}</div>
  <div class="row between" style="margin:14px 2px 8px"><div><h3 style="font-size:18px">${S.day===TODAY?'Hari ini · ':''}${fdl(S.day)}</h3>
    <div class="muted">${nPes} pesanan${nSt?' · '+nSt+' rencana ready stock':''} · ${P.length} item dipanggang</div></div></div>`;
  if(!P.length)return h+`<div class="card empty">Belum ada yang perlu dipanggang di tanggal ini 🎉</div>`;
  h+=`<div class="muted" style="margin:0 2px 8px">Urut dari jam ambil paling awal · ketuk kartu untuk lihat pesanan</div>`+P.map(r=>pcard(r,S.day)).join('');
  const tl=os.filter(o=>o.src!=='st').sort((a,b)=>(a.jam||'99').localeCompare(b.jam||'99'));
  h+=`<div class="card"><h3 style="font-size:17px">🕑 Urutan ambil / kirim</h3><div class="tl" style="margin-top:8px">${tl.map(o=>`<div class="tli"><span class="h">${o.jam||'—'}</span> · <b>${esc(o.nama)}</b> ${tag(o.src)} ${o.paid?'<span class="tag st">Lunas</span>':'<span class="tag ls" style="background:var(--red-soft);color:var(--red)">Belum bayar</span>'}
    <div class="muted">${esc(o.to)} · ${o.items.map(([p,s,f,q])=>esc(p+' '+s+(f?' '+f:''))+' ×'+q).join(', ')}</div></div>`).join('')}</div></div>`;
  return h;
}
function vRange(n){
  const days=[...Array(n)].map((_,i)=>addDays(TODAY,i));
  const os=ORD.filter(o=>days.indexOf(o.date)>=0);
  const tot={};days.forEach(d=>{plan(ORD.filter(o=>o.date===d)).forEach(r=>{const t=tot[r.key]=tot[r.key]||{r,bake:0};t.bake+=r.bake;});});
  const L=Object.values(tot).sort((a,b)=>a.r.name.localeCompare(b.r.name));
  let h=`<div class="kpi"><div><small>Pesanan</small><b>${os.filter(o=>o.src!=='st').length}</b></div><div><small>Hari produksi</small><b>${new Set(os.map(o=>o.date)).size}</b></div><div><small>Item dipanggang</small><b>${L.reduce((s,t)=>s+t.bake,0)}</b></div></div>`;
  if(n===7){
    h+=`<h3 style="font-size:17px;margin:16px 2px 8px">Per hari</h3>`+days.map(d=>{const P2=plan(ORD.filter(o=>o.date===d));
      return `<div class="day ${d===TODAY?'today':''}" onclick="S.view='hari';S.day='${d}';render()"><div class="dl"><b>${fd(d)}${d===TODAY?' · hari ini':''}</b><span class="muted">${P2.length?P2.length+' item ›':'libur'}</span></div>
      ${P2.length?`<div class="pills">${P2.map(r=>`<span class="pill">${r.d.ic} ${esc(r.name)} <b>${r.bake} ${r.unitLbl}</b></span>`).join('')}</div>`:''}</div>`}).join('');
  }
  const eggs=L.reduce((s,t)=>s+(t.r.d.egg||0)*t.bake,0);
  h+=`<div class="card" style="margin-top:12px"><div class="row between"><h3 style="font-size:17px">🧺 Total produksi ${n===7?'minggu ini':'2 minggu'}</h3><span class="muted">${fd(days[0])} – ${fd(days[n-1])}</span></div>
    <div class="muted" style="margin-bottom:6px">Dijumlah per hari produksi (tiap hari dipanggang fresh)</div>
    ${L.map(t=>`<div class="tot"><span>${t.r.d.ic} ${esc(t.r.name)}</span><span><b class="n">${t.bake}</b> ${t.r.unitLbl}</span></div>`).join('')}
    <div class="shop"><b>🛒 Persiapan belanja</b><div class="muted" style="margin-top:4px">${eggs?'🥚 Telur besar untuk brownies: <b style="color:var(--ink)">'+eggs+' butir</b><br>':''}Daftar belanja lengkap (terigu, gula, keju, coklat…) muncul otomatis setelah resep diisi di <b>Tahap 3</b>.</div>
    <button class="btn sm ghost" style="margin-top:8px" onclick="toast('📋 Total produksi disalin')">📋 Salin daftar</button></div></div>`;
  return h;
}

function render(){
  let h=`<div class="mock">🧪 <b>Mockup</b> · data contoh, belum tersambung ke sistem. Silakan diklik-klik.</div>
  <div class="tabs"><button>📊 Ringkasan</button><button>🧾 Pesanan</button><button class="on">📋 Baking Plan</button><button>💰 Bayar</button><button>🧁 Produksi</button><button>📦 Kelola PO</button></div>
  <div class="card"><div class="row between"><h2 style="font-size:20px">Baking Plan</h2><span class="muted">${fd(TODAY)}</span></div>
    <div class="addbar" style="margin-top:12px"><button class="btn" onclick="openAdd('ls')">＋ Pesanan langsung</button><button class="btn ghost" onclick="openAdd('st')">＋ Ready stock</button></div>
    <div class="seg2">${[['hari','📅 Harian'],['minggu','🗓 7 hari'],['2minggu','🧺 14 hari']].map(([k,l])=>`<button class="${S.view===k?'on':''}" onclick="S.view='${k}';render()">${l}</button>`).join('')}</div>
    <div class="row" style="gap:12px;margin-top:10px;font-size:12px">${tag('po')} dari sistem PO ${tag('ls')} pesanan WA ${tag('st')} bikin buat dijual</div>
  </div>`;
  h+=S.view==='hari'?vDay():vRange(S.view==='minggu'?7:14);
  document.getElementById('app').innerHTML=h;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ===== form tambah ===== */
let F=null;
function openAdd(src){F={src,nama:'',wa:'',date:S.day||TODAY,jam:'',to:'',items:[],paid:false,note:'',pick:{p:'',s:'',f:'',q:1},paste:''};renderModal();}
function closeM(){F=null;document.getElementById('modal').innerHTML='';}
function renderModal(){
  if(!F)return;const m=MENU.find(x=>x.p===F.pick.p);
  const isSt=F.src==='st';
  document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">
    <div class="row between"><h2 style="font-size:20px">${isSt?'＋ Rencana ready stock':'＋ Pesanan langsung'}</h2><button class="btn sm ghost" onclick="closeM()">✕</button></div>
    ${isSt?`<p class="muted" style="margin:4px 0 0">Untuk produk yang dibikin dulu baru dijual. Ikut masuk baking plan.</p>`:`
    <div class="paste"><b style="font-size:13.5px">💬 Tempel chat WA customer</b><div class="muted">Nama, produk & jumlah diisi otomatis, tinggal dicek.</div>
      <textarea rows="3" style="margin-top:6px" placeholder="cth: Halo kak, aku Dina mau pesen dark choco 1 loaf sama brownies 20x20 1 buat kamis jam 4 sore ya" oninput="F.paste=this.value">${esc(F.paste)}</textarea>
      <button class="btn sm" style="margin-top:6px" onclick="parsePaste()">✨ Isi otomatis</button></div>
    <div class="g2"><div><label>Nama</label><input value="${esc(F.nama)}" oninput="F.nama=this.value"></div><div><label>No. WA</label><input value="${esc(F.wa)}" oninput="F.wa=this.value" inputmode="tel" placeholder="08…"></div></div>`}
    <div class="g2"><div><label>${isSt?'Tanggal produksi':'Tanggal ambil/kirim'}</label><input type="date" value="${F.date}" onchange="F.date=this.value"></div>
      ${isSt?'<div></div>':`<div><label>Jam</label><input type="time" value="${F.jam}" onchange="F.jam=this.value"></div>`}</div>
    ${isSt?'':`<label>Kirim ke</label><select onchange="F.to=this.value"><option value="">— pilih —</option>${['🏢 Lippo','🏢 VIVERE','🚚 Antar sendiri','🛵 GoSend','🏠 Ambil sendiri'].map(x=>`<option ${F.to===x?'selected':''}>${x}</option>`).join('')}</select>`}
    <label>Produk</label>
    <div class="g3"><select onchange="F.pick={p:this.value,s:'',f:'',q:1};renderModal()"><option value="">Produk…</option>${['Savory','Sweet'].map(c=>`<optgroup label="${c} treats">${MENU.filter(x=>x.cat===c).map(x=>`<option ${F.pick.p===x.p?'selected':''}>${x.p}</option>`).join('')}</optgroup>`).join('')}</select>
      ${m&&m.f?`<select onchange="F.pick.f=this.value"><option value="">Rasa…</option>${m.f.map(x=>`<option ${F.pick.f===x?'selected':''}>${x}</option>`).join('')}</select>`:`<select onchange="F.pick.s=this.value" ${m?'':'disabled'}><option value="">Ukuran…</option>${m?m.s.map(x=>`<option ${F.pick.s===x[0]?'selected':''} value="${esc(x[0])}">${esc(x[0])}${x[1]?' · '+rp(x[1]):''}</option>`).join(''):''}</select>`}
      <input type="number" min="1" value="${F.pick.q}" oninput="F.pick.q=+this.value"></div>
    ${m&&m.f&&m.s.length>1?`<select style="margin-top:6px" onchange="F.pick.s=this.value"><option value="">Ukuran…</option>${m.s.map(x=>`<option ${F.pick.s===x[0]?'selected':''} value="${esc(x[0])}">${esc(x[0])} · ${rp(x[1])}</option>`).join('')}</select>`:''}
    <button class="btn sm ghost" style="margin-top:8px" onclick="addItem()">＋ Tambah item</button>
    ${F.items.map(([p,s,f,q],i)=>`<div class="itl"><span>${esc(p+' '+s+(f?' · '+f:''))} <b>×${q}</b></span><span><b>${rp(price(p,s,f)*q)}</b> <a href="#" onclick="F.items.splice(${i},1);renderModal();return false" style="color:var(--red);margin-left:6px">✕</a></span></div>`).join('')}
    ${F.items.length&&!isSt?`<div class="row between" style="margin-top:8px"><b>Total</b><b>${rp(F.items.reduce((s,[p,sz,f,q])=>s+price(p,sz,f)*q,0))}</b></div>`:''}
    ${isSt?'':`<label>Catatan</label><input value="${esc(F.note)}" oninput="F.note=this.value" placeholder="cth: tulisan HBD, tanpa kacang">
    <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" style="width:auto" ${F.paid?'checked':''} onchange="F.paid=this.checked"> Sudah dibayar</label>`}
    <button class="btn" style="width:100%;margin-top:14px" onclick="saveAdd()">Simpan ke baking plan</button>
  </div></div>`;
}
function price(p,s,f){const m=MENU.find(x=>x.p===p);if(m.fp)return m.fp[f]||0;const z=m.s.find(x=>x[0]===s);return z?z[1]:0;}
function addItem(){const k=F.pick,m=MENU.find(x=>x.p===k.p);if(!m)return toast('Pilih produk dulu');
  if(m.f&&!k.f)return toast('Pilih rasa dulu');const s=k.s||(m.s.length===1?m.s[0][0]:'');if(!s)return toast('Pilih ukuran dulu');
  F.items.push([k.p,s,k.f||'',Math.max(1,k.q||1)]);F.pick={p:'',s:'',f:'',q:1};renderModal();}
function parsePaste(){const t=F.paste.toLowerCase();if(!t.trim())return toast('Tempel chat dulu');
  const nm=F.paste.match(/aku\s+([A-Z][a-z]+)/)||F.paste.match(/(?:saya|nama)\s+([A-Z][a-z]+)/i);if(nm)F.nama=nm[1];
  const add=(p,s,f,re)=>{const mm=t.match(re);if(mm)F.items.push([p,s,f,+(mm[1]||1)]);};
  add('Dark Choco Layer','Loaf 22x10','',/dark choco\w*\s*(\d+)\s*loaf/);add('Brownies','20x20cm','',/brownies\s*20x20\s*(\d+)/);
  add('Chiffon Roll','Whole roll','Pandan Kelapa',/pandan kelapa\s*(\d+)\s*roll/);
  if(/kamis/.test(t))F.date=D(22);const j=t.match(/jam\s*(\d{1,2})/);if(j){let hh=+j[1];if(/sore|malam/.test(t)&&hh<12)hh+=12;F.jam=String(hh).padStart(2,'0')+':00';}
  toast(F.items.length?'✨ Terisi otomatis, cek lagi ya':'Belum kebaca, isi manual ya');renderModal();}
function saveAdd(){if(!F.items.length)return toast('Tambah minimal 1 item');if(F.src==='ls'&&!F.nama.trim())return toast('Nama wajib diisi');
  ORD.push({id:(F.src==='st'?'S-':'L-')+Date.now()%1000,src:F.src,nama:F.src==='st'?'Ready stock':F.nama,date:F.date,jam:F.jam,to:F.to||'—',items:F.items,paid:F.paid,note:F.note});
  S.view='hari';S.day=F.date;closeM();render();toast('✅ Masuk baking plan');}
render();
</script></body></html>
